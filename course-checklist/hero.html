<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root{
    --cream:#faf8f2; --cream2:#f1ede1; --ink:#12362c; --green:#1d5a47; --mint:#17a77e;
    --mint-soft:#dff3ea; --gold:#b9893a; --gold-soft:#f3e6c8; --line:#e4dfd0; --muted:#8a9a93;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1000px;font-family:'Vazirmatn',sans-serif}
  .stage{position:relative;width:1600px;height:1000px;overflow:hidden;
    background:
      radial-gradient(900px 600px at 18% 85%, rgba(23,167,126,.16), transparent 70%),
      radial-gradient(700px 500px at 90% 8%, rgba(185,137,58,.14), transparent 70%),
      linear-gradient(135deg,#fdfcf8 0%,#f3efe3 100%);}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(#cfc8b3 1.6px,transparent 1.7px);background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%,transparent 38%,#000 95%);
            mask-image:radial-gradient(ellipse at 50% 50%,transparent 38%,#000 95%)}
  svg.flow{position:absolute;inset:0}
  /* checklist card */
  .card{position:absolute;left:330px;top:120px;width:790px;height:760px;background:#fff;border-radius:44px;
    box-shadow:0 50px 90px -30px rgba(18,54,44,.35),0 8px 24px rgba(18,54,44,.08);padding:48px 56px;border:1px solid #efeadb}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
  .head .t{font-weight:800;font-size:40px;color:var(--ink)}
  .pill{font-weight:700;font-size:26px;color:var(--gold);background:var(--gold-soft);padding:8px 24px;border-radius:99px}
  .bar{height:14px;border-radius:9px;background:var(--cream2);margin-bottom:34px;overflow:hidden;direction:rtl}
  .bar i{display:block;height:100%;width:80%;border-radius:9px;background:linear-gradient(270deg,var(--mint),var(--green))}
  .row{display:flex;align-items:center;gap:26px;height:98px;padding:0 28px;border-radius:26px;margin-bottom:14px;
    font-weight:700;font-size:36px;color:var(--ink);background:#fbfaf5;border:1.5px solid #f0ecde}
  .row .n{margin-inline-start:auto;font-size:26px;color:var(--muted);font-weight:600}
  .ck{flex:none;width:58px;height:58px;border-radius:50%;background:var(--mint);display:grid;place-items:center;
    box-shadow:0 8px 16px -6px rgba(23,167,126,.6)}
  .ck svg{width:30px;height:30px}
  .row.active{background:var(--ink);color:#fff;border-color:var(--ink);height:112px;
    box-shadow:0 24px 40px -18px rgba(18,54,44,.7)}
  .row.active .ck{background:var(--gold);box-shadow:0 8px 16px -6px rgba(185,137,58,.8);
    width:64px;height:64px}
  .row.active .n{color:#e6c98f}
  /* scattered icons */
  .bub{position:absolute;width:132px;height:132px;border-radius:38px;background:#fff;display:grid;place-items:center;
    box-shadow:0 24px 40px -16px rgba(18,54,44,.25);border:1px solid #efeadb}
  .bub svg{width:62px;height:62px}
  .b1{left:1215px;top:130px;transform:rotate(9deg)}
  .b2{left:1360px;top:370px;transform:rotate(-8deg);width:118px;height:118px}
  .b3{left:1205px;top:640px;transform:rotate(6deg);width:124px;height:124px}
  .lbl{position:absolute;left:1190px;top:820px;width:330px;text-align:center;font-weight:600;font-size:28px;color:var(--muted)}
  /* deal badge */
  .deal{position:absolute;left:52px;top:430px;width:272px;height:330px;border-radius:40px;
    background:linear-gradient(150deg,#1d5a47,#0f2f26);color:#fff;padding:34px 20px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;text-align:center;
    box-shadow:0 40px 70px -24px rgba(15,47,38,.8);border:2px solid rgba(255,255,255,.08)}
  .deal .ico{width:112px;height:112px;border-radius:32px;background:var(--gold);display:grid;place-items:center}
  .deal .ico svg{width:64px;height:64px}
  .deal b{display:block;font-weight:900;font-size:42px;line-height:1.3;white-space:nowrap}
  .deal span{display:block;margin-top:6px;font-weight:600;font-size:24px;color:#bfe3d3;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>

  <!-- dashed flow lines: scattered -> checklist -> deal -->
  <svg class="flow" viewBox="0 0 1600 1000" fill="none">
    <path d="M1215 205 C1170 230 1150 260 1120 300" stroke="#b9893a" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"/>
    <path d="M1360 430 C1260 450 1190 470 1120 480" stroke="#b9893a" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"/>
    <path d="M1215 700 C1180 700 1150 690 1120 680" stroke="#b9893a" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"/>
    <path d="M324 595 L386 595" stroke="#17a77e" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <circle cx="1520" cy="140" r="9" fill="#17a77e" opacity=".35"/>
    <circle cx="1490" cy="600" r="14" fill="#b9893a" opacity=".3"/>
    <circle cx="150" cy="250" r="22" fill="#17a77e" opacity=".18"/>
    <circle cx="230" cy="130" r="10" fill="#b9893a" opacity=".35"/>
  </svg>

  <div class="card">
    <div class="head">
      <div class="t">چک‌لیست معامله</div>
      <div class="pill">۴ از ۵ مرحله</div>
    </div>
    <div class="bar"><i></i></div>

    <div class="row"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>جذب و شناسایی مشتری<span class="n">۱</span></div>
    <div class="row"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>نیازسنجی و تماس<span class="n">۲</span></div>
    <div class="row"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>بازدید هدفمند<span class="n">۳</span></div>
    <div class="row"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>مذاکره و توافق<span class="n">۴</span></div>
    <div class="row active"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>نشست و کمیسیون<span class="n">۵</span></div>
  </div>

  <!-- scattered activity -->
  <div class="bub b1"><svg viewBox="0 0 24 24" fill="none" stroke="#1d5a47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
  <div class="bub b2"><svg viewBox="0 0 24 24" fill="none" stroke="#b9893a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></div>
  <div class="bub b3"><svg viewBox="0 0 24 24" fill="none" stroke="#17a77e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></div>
  <div class="lbl">فعالیت پراکنده</div>

  <!-- deal -->
  <div class="deal">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#0f2f26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg></div>
    <div><b>معامله کامل</b><span>قدم‌به‌قدم، بی‌خطا</span></div>
  </div>
</div>
</body>
</html>
